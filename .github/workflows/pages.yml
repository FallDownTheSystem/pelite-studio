name: Deploy PeLite Studio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Sets up Vite+, Node.js and pnpm, and installs the dependencies.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true

      - name: Check types
        run: vp exec vue-tsc --noEmit -p tsconfig.app.json

      - name: Check format and lint
        run: vp check

      - name: Run tests
        run: vp test run

      - name: Build site
        run: vp build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
